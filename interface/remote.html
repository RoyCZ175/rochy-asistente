<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Rochy — Micrófono remoto</title>
<style>
  :root {
    --blue: #00d9ff;
    --purple: #b347ff;
    --pink: #ff2f9e;
    --green: #3dffa0;
    --bg: #05060b;
    --panel: #0c0f1a;
    --border: #1c2340;
    --text: #d9e4ff;
    --text-dim: #8ea0c9;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', 'Calibri', sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    padding: 18px;
  }
  #header {
    text-align: center;
    flex: 0 0 auto;
  }
  #title {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 4px;
    margin: 0;
    background: linear-gradient(90deg, var(--blue), var(--purple), var(--pink));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  #connStatus {
    margin-top: 6px;
    font-size: 12px;
    color: var(--text-dim);
  }
  #connStatus.connected { color: var(--green); }
  #connStatus.disconnected { color: var(--pink); }

  #log {
    flex: 1 1 auto;
    overflow-y: auto;
    margin: 16px 0;
    padding: 4px 2px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 0;
  }
  .bubble {
    max-width: 85%;
    padding: 8px 12px;
    border-radius: 14px;
    font-size: 13px;
    line-height: 1.4;
    word-wrap: break-word;
  }
  .bubble.user {
    align-self: flex-end;
    background: linear-gradient(135deg, #1c3a66, #23305e);
    color: #e4edff;
  }
  .bubble.assistant {
    align-self: flex-start;
    background: var(--panel);
    border: 1px solid var(--border);
    color: #cfe0ff;
  }

  #stateLabel {
    text-align: center;
    font-size: 13px;
    color: var(--text-dim);
    flex: 0 0 auto;
    margin-bottom: 10px;
    min-height: 18px;
  }

  #talkBtn {
    flex: 0 0 auto;
    width: 150px;
    height: 150px;
    border-radius: 50%;
    margin: 0 auto 20px auto;
    border: none;
    background: linear-gradient(135deg, var(--blue), var(--purple));
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 30px #00d9ff33;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    user-select: none;
    touch-action: none;
  }
  #talkBtn.recording {
    transform: scale(1.08);
    background: linear-gradient(135deg, var(--pink), #ff5c3d);
    box-shadow: 0 0 50px #ff2f9e66;
  }
  #talkBtn:disabled {
    opacity: 0.4;
  }
  #hint {
    text-align: center;
    font-size: 11px;
    color: var(--text-dim);
    flex: 0 0 auto;
    padding-bottom: 6px;
  }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <h1 id="title">ROCHY</h1>
    <div id="connStatus" class="disconnected">Conectando…</div>
  </div>

  <div id="log"></div>

  <div id="stateLabel"></div>
  <button id="talkBtn">Mantén<br>presionado<br>para hablar</button>
  <div id="hint">Este celular es un micrófono remoto — no hace falta decir "hola" primero.</div>
</div>

<script>
const log = document.getElementById('log');
const connStatus = document.getElementById('connStatus');
const stateLabel = document.getElementById('stateLabel');
const talkBtn = document.getElementById('talkBtn');

const STATE_LABELS = {
  idle: '', listening: 'Escuchando…', thinking: 'Pensando…', speaking: 'Hablando…',
};

function addBubble(role, text) {
  const div = document.createElement('div');
  div.className = 'bubble ' + (role === 'user' ? 'user' : 'assistant');
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

// --- WebSocket: mismo servidor que usa la interfaz de escritorio ---
let ws;
function connect() {
  ws = new WebSocket(`ws://${location.hostname}:8765`);
  ws.onopen = () => {
    connStatus.textContent = 'Conectado';
    connStatus.className = 'connected';
  };
  ws.onclose = () => {
    connStatus.textContent = 'Reconectando…';
    connStatus.className = 'disconnected';
    setTimeout(connect, 1500);
  };
  ws.onerror = () => ws.close();
  ws.onmessage = (event) => {
    let data;
    try { data = JSON.parse(event.data); } catch (e) { return; }
    if (data.type === 'state') {
      stateLabel.textContent = STATE_LABELS[data.state] || '';
    } else if (data.type === 'transcript' && data.text) {
      addBubble(data.role, data.text);
    }
  };
}
connect();

// --- Grabación push-to-talk ---
let mediaRecorder = null;
let chunks = [];
let stream = null;

const CANDIDATE_MIME_TYPES = [
  'audio/webm;codecs=opus',
  'audio/webm',
  'audio/mp4',
  'audio/aac',
];

function pickMimeType() {
  for (const type of CANDIDATE_MIME_TYPES) {
    if (window.MediaRecorder && MediaRecorder.isTypeSupported(type)) return type;
  }
  return '';
}

async function startRecording() {
  if (mediaRecorder) return;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    addBubble('assistant', 'No pude acceder al micrófono del celular: ' + e.message);
    return;
  }
  const mimeType = pickMimeType();
  chunks = [];
  mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
  mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
  mediaRecorder.onstop = () => {
    stream.getTracks().forEach((t) => t.stop());
    stream = null;
    const usedMime = mediaRecorder.mimeType || 'audio/webm';
    const blob = new Blob(chunks, { type: usedMime });
    mediaRecorder = null;
    if (blob.size < 500) return; // grabación demasiado corta/vacía, no vale la pena mandarla
    const reader = new FileReader();
    reader.onloadend = () => {
      const base64 = reader.result.split(',')[1];
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'audio_command', audio: base64, mime: usedMime }));
      }
    };
    reader.readAsDataURL(blob);
  };
  mediaRecorder.start();
  talkBtn.classList.add('recording');
  talkBtn.textContent = 'Soltá para\nenviar';
}

function stopRecording() {
  talkBtn.classList.remove('recording');
  talkBtn.textContent = 'Mantén\npresionado\npara hablar';
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  }
}

talkBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startRecording(); });
talkBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopRecording(); });
talkBtn.addEventListener('mousedown', startRecording);
talkBtn.addEventListener('mouseup', stopRecording);
talkBtn.addEventListener('mouseleave', () => { if (mediaRecorder) stopRecording(); });

if (!window.MediaRecorder || !navigator.mediaDevices) {
  talkBtn.disabled = true;
  addBubble('assistant', 'Este navegador no soporta grabar audio (probá con Chrome o Safari actualizados).');
}
</script>
</body>
</html>
