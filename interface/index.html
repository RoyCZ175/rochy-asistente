<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Rochy</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Fondo tipo "nubes" que cambia de color según el modo (verde/celeste
     online, azul/rojo local) — ver style.css y script.js (updateStatusBar). -->
<div id="modeGlow"></div>
<div id="app">

  <!-- ============ Barra lateral ============ -->
  <div id="sidebar">
    <button class="brand" id="brandBtn" title="Reinicia la conversación">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 2l2.2 6.8L21 11l-6.8 2.2L12 20l-2.2-6.8L3 11l6.8-2.2L12 2Z"/></svg>
    </button>
    <div class="navIcons">
      <button class="navBtn active" id="navChat" title="Ir al chat">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 1 3.5 6.6L4 20l1.2-3.8A7.96 7.96 0 0 1 4 12Z"/></svg>
      </button>
      <button class="navBtn" id="navMode" title="Cambiar modo (local/online)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><line x1="3" y1="12" x2="21" y2="12"/></svg>
      </button>
      <button class="navBtn" id="navStudy" title="Modo estudio">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 2 9l10 5 10-5-10-5Z"/><path d="M6 11.5V17c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5v-5.5"/></svg>
      </button>
      <button class="navBtn" id="navFiles" title="Agregar archivos">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8A2 2 0 0 1 21 9.5V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg>
      </button>
      <button class="navBtn" id="navHelp" title="Ayuda">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.3 9.3a2.7 2.7 0 1 1 3.9 2.4c-.9.5-1.2 1-1.2 2.1"/><circle cx="12" cy="17.2" r="0.6" fill="currentColor" stroke="none"/></svg>
      </button>
    </div>
    <div class="avatar" title="Roger">R</div>
  </div>
  <!-- Solo se ve (y hace algo) en pantallas chicas — un fondo oscuro detrás
       de la barra lateral cuando se abre como cajón, para cerrarla con un
       clic afuera. -->
  <div id="sidebarBackdrop"></div>

  <!-- ============ Contenido principal ============ -->
  <div id="main">
    <div id="topRow">
      <!-- Solo visible en pantallas chicas (ver @media más abajo) — abre la
           barra lateral como un cajón, en vez de dejarla fija ocupando
           espacio en una ventana angosta. -->
      <button id="hamburgerBtn" title="Menú">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
      </button>
    </div>

    <div id="header">
      <h1 id="assistantName" class="display-font">ROCHY</h1>
      <p id="tagline">Tu asistente inteligente</p>
    </div>

    <div id="orbWrap">
      <canvas id="orbGl"></canvas>
      <canvas id="orbParticles"></canvas>
    </div>

    <div id="statusPill">
      <span id="statusDot"></span>
      <div>
        <div id="statusText">En línea</div>
        <div id="statusSub">Siempre listo para ayudarte</div>
      </div>
    </div>

    <div id="cards">
      <button class="card blue" id="modeBtn" title="Cambia entre modo en línea y modo local">
        <div class="cardIcon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><line x1="3" y1="12" x2="21" y2="12"/></svg></div>
        <div class="cardTitle display-font">Cambiar modo</div>
        <div class="cardSub">Ajusta el estilo de conversación</div>
        <div class="cardArrow">›</div>
      </button>
      <button class="card purple" id="studyBtn" title="Crea una zona de estudio y elige tus apuntes">
        <div class="cardIcon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H12v16H5.5C4.7 20 4 19.3 4 18.5V5.5Z"/><path d="M20 5.5C20 4.7 19.3 4 18.5 4H12v16h6.5c.8 0 1.5-.7 1.5-1.5V5.5Z"/></svg></div>
        <div class="cardTitle display-font">Estudiar</div>
        <div class="cardSub">Aprende y resuelve tus dudas</div>
        <div class="cardArrow">›</div>
      </button>
      <button class="card pink" id="helpBtn" title="¿Qué le puedo decir a Rochy?">
        <div class="cardIcon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.3 9.3a2.7 2.7 0 1 1 3.9 2.4c-.9.5-1.2 1-1.2 2.1"/><circle cx="12" cy="17.2" r="0.6" fill="currentColor" stroke="none"/></svg></div>
        <div class="cardTitle display-font">Ayuda</div>
        <div class="cardSub">Explora funciones y atajos</div>
        <div class="cardArrow">›</div>
      </button>
      <button class="card green" id="remoteBtn" title="Usa el celular como micrófono principal">
        <div class="cardIcon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="16" rx="2.5"/><line x1="12" y1="22" x2="12" y2="18.3"/><line x1="9" y1="22" x2="15" y2="22"/></svg></div>
        <div class="cardTitle display-font" id="remoteBtnTitle">Control remoto</div>
        <div class="cardSub" id="remoteBtnSub">Usa el celular como micrófono</div>
        <div class="cardArrow">›</div>
      </button>
    </div>

    <!-- Único bloque que se desplaza — el resto de la interfaz queda fijo. -->
    <div id="log"></div>

    <div id="inputRow">
      <input id="textInput" type="text" placeholder="Escríbele a Rochy…" autocomplete="off">
      <button class="roundBtn" id="sendBtn" title="Enviar">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M21 3 3 10.5l7 2.5 2.5 7L21 3Z"/></svg>
      </button>
    </div>

    <div id="controlRow">
      <div id="controlPill">
        <button class="pillBtn" id="newChatBtn" title="Empieza una conversación nueva (borra el chat)">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          Nueva
        </button>
        <button class="pillBtn" id="pauseBtn" title="Deja de escuchar activamente">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
          Pausar
        </button>
        <button class="pillBtn" id="powerBtn" title="Cierra la aplicación por completo">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="12" y1="3" x2="12" y2="11"/><path d="M7 6.5a8 8 0 1 0 10 0"/></svg>
          Apagar
        </button>
      </div>
    </div>

    <div id="footer">ROCHY · AI</div>
    <div id="connLabel">conectando…</div>
  </div>
</div>

<!-- Vista en vivo de la cámara del proyecto de gestos (gestos_control, otro
     microservicio, ver rochy_link.py) — solo aparece cuando llegan frames de
     verdad por WebSocket, y se oculta sola si dejan de llegar, para
     confirmar a simple vista que la cámara está siendo usada. -->
<div id="gestureCamPanel">
  <div id="gestureCamHeader">
    <span>🖐️ Cámara de gestos</span>
    <span id="gestureCamDot"></span>
  </div>
  <img id="gestureCamImg" alt="Cámara de gestos">
  <div id="gestureCamLabel"></div>
</div>

<!-- Ventana flotante reutilizable: ayuda y el selector de materias de
     estudio la usan, en vez de alert()/prompt() nativos del navegador. -->
<div id="modalOverlay">
  <div id="modalBox">
    <div id="modalHeader">
      <span id="modalTitle" class="display-font"></span>
      <button id="modalClose">✕</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script src="orb.js"></script>
<script src="script.js"></script>
</body>
</html>
